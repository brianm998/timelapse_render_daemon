#
# The trd and trdw binaries: command line, gRPC server, TLS, pairing, mDNS and service install.

[package]
name = "trd"
default-run = "trd"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap.workspace = true
trd-core = { path = "../trd-core" }
trd-proto = { path = "../trd-proto" }
tokio.workspace = true
tokio-stream = { workspace = true, features = ["sync", "net"] }
tonic = { workspace = true, features = ["tls-ring"] }
prost.workspace = true
rcgen.workspace = true
time.workspace = true
sha2.workspace = true
hex.workspace = true
rand.workspace = true
base64.workspace = true
uuid.workspace = true
tracing.workspace = true
serde_json.workspace = true
sysinfo.workspace = true
chrono.workspace = true

[dev-dependencies]
tempfile.workspace = true
trd-testtools = { path = "../trd-testtools" }

[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
