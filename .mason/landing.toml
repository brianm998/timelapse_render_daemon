mode = "direct-ci"
base = "develop"
window = "20m"
max_size = 10
parallel = 1

[[tier]]
name = "batch"
suites = ["trd-test", "trd-e2e", "kotlin-test", "android-test", "ios-kit-test"]

[on_red]
ladder = ["rerun-failed", "blame-by-impact", "bisect", "ask"]
