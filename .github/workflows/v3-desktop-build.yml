#
# Builds the desktop client's packages (spec 2 §8, DSK-13): a signed and notarized .dmg for each
# macOS architecture, the Linux .deb and the Windows .msi. It is only called with `uses:` (by
# v3-release.yml and v3-system-tests.yml); the caller passes the version and whether the run is a
# release.

name: v3 desktop packages

on:
  workflow_call:
    inputs:
      version:
        description: 'version without a leading v, as in v3/VERSION (e.g. 3.0.0 or 3.0.0-beta.1)'
        type: string
        required: true
      is_release:
        description: 'true for a v3.* tag push: the macOS builds must then be signed'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop ${{ matrix.target }} (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos-arm64
            runner: macos-15
            task: ':desktop:packageReleaseDmg'
            format: dmg
            asset: 'TimelapseRenderMonitor-@V@-macos-arm64.dmg'
          - target: macos-x64
            runner: macos-15-intel
            task: ':desktop:packageReleaseDmg'
            format: dmg
            asset: 'TimelapseRenderMonitor-@V@-macos-x64.dmg'
          - target: linux-x64
            runner: ubuntu-24.04
            task: ':desktop:packageReleaseDeb'
            format: deb
            asset: 'timelapse-render-monitor_@V@_amd64.deb'
          - target: windows-x64
            runner: windows-2022
            task: ':desktop:packageReleaseMsi'
            format: msi
            asset: 'TimelapseRenderMonitor-@V@-windows-x64.msi'
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.version }}
      IS_RELEASE: ${{ inputs.is_release }}
    steps:
      # A release must be signed, so a macOS job without a certificate fails here, before anything
      # is built.
      - name: Check the signing secrets
        id: signing
        if: runner.os == 'macOS'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
        run: |
          if [ -n "$P12" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_RELEASE" = true ]; then
            echo "::error::macOS release builds must be signed"
            exit 1
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v5

      - name: Install the .deb tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot binutils

      - name: Put the WiX toolset on PATH
        if: runner.os == 'Windows'
        run: |
          if ! command -v candle.exe >/dev/null 2>&1; then
            choco install wixtoolset --version 3.14.1 -y --no-progress
            # Takes effect from the next step.
            printf '%s\n' 'C:\Program Files (x86)\WiX Toolset v3.14\bin' >> "$GITHUB_PATH"
          fi

      - name: Import the Developer ID identity into a temporary keychain
        if: steps.signing.outputs.signed == 'true'
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          if [ -z "$API_KEY_P8" ] || [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ]; then
            echo "::error::a signed macOS build needs APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID and APPLE_API_ISSUER_ID"
            exit 1
          fi
          if [ -z "$TEAM_ID" ]; then
            echo "::error::a signed macOS build needs APPLE_TEAM_ID"
            exit 1
          fi

          keychain="$RUNNER_TEMP/trm-signing.keychain-db"
          p12="$RUNNER_TEMP/developer-id.p12"
          key="$RUNNER_TEMP/AuthKey_$API_KEY_ID.p8"
          # Exported first, so that the last step deletes them even when this one fails part way.
          {
            echo "SIGN_KEYCHAIN=$keychain"
            echo "APPLE_API_KEY_PATH=$key"
          } >> "$GITHUB_ENV"
          printf '%s' "$P12" | base64 --decode > "$p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm -f "$p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          search=()
          while IFS= read -r kc; do
            search+=("$kc")
          done < <(security list-keychains -d user | sed 's/^[[:space:]]*"//; s/"[[:space:]]*$//')
          security list-keychains -d user -s "$keychain" "${search[@]}"

          identity="$(security find-identity -v "$keychain" \
            | sed -n "s/.*\"\(Developer ID Application: .* (${TEAM_ID})\)\".*/\1/p" | head -n 1)"
          if [ -z "$identity" ]; then
            echo "::error::the certificate holds no Developer ID Application identity for team $TEAM_ID"
            exit 1
          fi

          printf '%s' "$API_KEY_P8" | base64 --decode > "$key"
          chmod 600 "$key"
          {
            echo "TRM_SIGN_IDENTITY=$identity"
            echo "APPLE_API_KEY_ID=$API_KEY_ID"
            echo "APPLE_API_ISSUER_ID=$API_ISSUER_ID"
          } >> "$GITHUB_ENV"

      - name: Build the package
        env:
          TASK: ${{ matrix.task }}
        run: ./v3/clients/kotlin/gradlew -p v3/clients/kotlin --no-daemon --console=plain "$TASK" "-Ptrm.version=$VERSION"

      - name: Find the package
        id: package
        env:
          FORMAT: ${{ matrix.format }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          built=(v3/clients/kotlin/desktop/build/compose/binaries/main-release/"$FORMAT"/*."$FORMAT")
          if [ "${#built[@]}" -ne 1 ]; then
            echo "::error::expected one .$FORMAT package, found ${#built[@]}"
            exit 1
          fi
          mkdir -p dist
          cp "${built[0]}" "dist/${ASSET//@V@/$VERSION}"
          echo "path=dist/${ASSET//@V@/$VERSION}" >> "$GITHUB_OUTPUT"

      - name: Notarize and staple the disk image
        if: steps.signing.outputs.signed == 'true'
        env:
          DMG: ${{ steps.package.outputs.path }}
        run: |
          set -euo pipefail
          auth=(--key "$APPLE_API_KEY_PATH" --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER_ID")
          result="$RUNNER_TEMP/notarytool.json"
          /usr/bin/xcrun notarytool submit "$DMG" "${auth[@]}" --wait --output-format json > "$result" || true
          cat "$result"
          echo
          id="$(/usr/bin/plutil -extract id raw -o - "$result" || true)"
          status="$(/usr/bin/plutil -extract status raw -o - "$result" || true)"
          if [ "$status" != Accepted ]; then
            if [ -n "$id" ]; then /usr/bin/xcrun notarytool log "$id" "${auth[@]}" || true; fi
            echo "::error::notarization of $DMG ended as '${status:-unknown}', not Accepted"
            exit 1
          fi
          # The ticket can take a while to reach the servers stapler asks.
          attempt=1
          until /usr/bin/xcrun stapler staple "$DMG"; do
            if [ "$attempt" -ge 8 ]; then
              echo "::error::stapling $DMG failed $attempt times"
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 15
          done
          /usr/bin/xcrun stapler validate "$DMG"

      - uses: actions/upload-artifact@v6
        with:
          name: release-asset-desktop-${{ matrix.target }}
          path: ${{ steps.package.outputs.path }}
          if-no-files-found: error

      - name: Delete the keychain and the API key
        if: always() && runner.os == 'macOS'
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi
          if [ -n "${APPLE_API_KEY_PATH:-}" ]; then rm -f "$APPLE_API_KEY_PATH"; fi
          rm -f "$RUNNER_TEMP/developer-id.p12"
